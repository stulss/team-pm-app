# 오프라인 개발용 로컬 Postgres (선택). 기본은 Supabase dev 프로젝트를 사용한다.
# 사용: docker compose up -d  →  DATABASE_URL=postgresql://postgres:postgres@localhost:54322/postgres
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - '54322:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
